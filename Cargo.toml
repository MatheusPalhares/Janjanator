[package]
name = "screenshare-win11"
version = "0.1.0"
edition = "2021"
authors = ["ScreenShare Win11 Native Team"]
description = "Aplicativo nativo ultra-leve de compartilhamento de tela e áudio isolado por janela (WGC + WASAPI PID Loopback + LiveKit SFU) para Windows 11"
license = "MIT"

[[bin]]
name = "screenshare-win11"
path = "src/main.rs"

[[bin]]
name = "sfu_relay"
path = "src/bin/sfu_relay.rs"

[dependencies]
# Geração de Token JWT LiveKit (HMAC-SHA256) e Serialização
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

# Compressão rápida de baixa latência para frames e pacotes de mídia
lz4_flex = "0.11"
jpeg-decoder = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Concorrência, Canais e Utilitários de Tempo/Logs
crossbeam-channel = "0.5"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
byteorder = "1.5"
rand = "0.8"

# WebSocket para sinalização LiveKit / SFU
tungstenite = "0.24"
url = "2.5"

# Interface Gráfica Nativa acelerada por GPU (OpenGL/WGL/DirectX via glow/eframe no Windows 11)
[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"

# APIs Nativas do Windows 11 (WGC, Direct3D11, WASAPI Process Loopback, Media Foundation, Win32)
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
